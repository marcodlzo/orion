name: Sandbox browser tests

# Separate from hermetic CI: requires a dedicated Appwrite sandbox project and
# Plaid/Dwolla sandbox credentials in the sandbox-e2e GitHub environment.
on:
  workflow_dispatch:
  # NIGHTLY, NOT PER-COMMIT.
  #
  # Per-commit is wrong for this suite: every run signs up a real Appwrite user,
  # links a real Plaid Item and creates a real Dwolla customer. Dwolla customers
  # cannot be deleted, only deactivated, so per-commit would accumulate
  # provider-side records forever.
  #
  # Manual-only was also wrong, which is why this exists. A suite nothing runs
  # is a suite that rots, and this one is the only thing that catches the class
  # of defect the unit suites structurally cannot: an empty-state crash, a
  # silent link failure, a form whose labels all point at the first input.
  #
  # Nightly is the compromise — recent enough that a break is attributable to a
  # small range of commits, rare enough that provider residue stays bounded.
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC. Off the hour, so it does not queue behind
                         # every other project's midnight cron.

permissions:
  contents: read

concurrency:
  group: sandbox-e2e
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    environment: sandbox-e2e
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion_e2e_password
          POSTGRES_DB: orion_e2e_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orion -d orion_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://orion:orion_e2e_password@localhost:5432/orion_e2e_test
      NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
      NEXT_PUBLIC_APPWRITE_PROJECT: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT }}
      NEXT_APPWRITE_KEY: ${{ secrets.NEXT_APPWRITE_KEY }}
      APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
      APPWRITE_USER_COLLECTION_ID: ${{ secrets.APPWRITE_USER_COLLECTION_ID }}
      APPWRITE_BANK_COLLECTION_ID: ${{ secrets.APPWRITE_BANK_COLLECTION_ID }}
      APPWRITE_TRANSACTION_COLLECTION_ID: ${{ secrets.APPWRITE_TRANSACTION_COLLECTION_ID }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      DWOLLA_KEY: ${{ secrets.DWOLLA_KEY }}
      DWOLLA_SECRET: ${{ secrets.DWOLLA_SECRET }}
      DWOLLA_ENV: sandbox
      CREDENTIAL_ENCRYPTION_KEYS: ${{ secrets.CREDENTIAL_ENCRYPTION_KEYS }}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${{ secrets.CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID }}
    steps:
      # FIRST, before anything expensive. Without this the job spends two
      # minutes on npm ci, a Chromium download and a production build, and then
      # dies on `E2E requires NEXT_APPWRITE_KEY` — which reads like a code
      # failure and names only the first missing value, so configuring them is
      # one round trip per secret.
      #
      # It REFUSES rather than skipping. A scheduled suite that quietly does
      # nothing when it is misconfigured is the same failure as a rate limiter
      # that silently stops counting: the signal keeps arriving green and
      # nobody learns the control stopped applying.
      - name: Require the sandbox-e2e secrets
        id: preflight
        run: |
          missing=()
          for name in NEXT_PUBLIC_APPWRITE_ENDPOINT NEXT_PUBLIC_APPWRITE_PROJECT \
                      NEXT_APPWRITE_KEY APPWRITE_DATABASE_ID \
                      APPWRITE_USER_COLLECTION_ID APPWRITE_BANK_COLLECTION_ID \
                      APPWRITE_TRANSACTION_COLLECTION_ID \
                      PLAID_CLIENT_ID PLAID_SECRET DWOLLA_KEY DWOLLA_SECRET \
                      CREDENTIAL_ENCRYPTION_KEYS CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            # Names only. These are the names of secrets, never their values.
            echo "::error::The sandbox-e2e environment is missing ${#missing[@]} secret(s): ${missing[*]}"
            echo "The browser suite cannot run. Set them on the sandbox-e2e" >&2
            echo "environment, not at repository scope." >&2
            exit 1
          fi
          echo "all 13 sandbox-e2e secrets are present"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      # ALWAYS, even when the suite failed. A run that fails partway leaves the
      # Appwrite records it had already created, and those are what the
      # migration source reads — residue does not stay cosmetic, it becomes
      # rows a backfill would migrate.
      #
      # The suite tears down after itself too; this is the backstop for the runs
      # that do not reach their own teardown.
      #
      # Gated on the preflight rather than plain `always()`. If the secrets are
      # absent the suite never connected to anything, so there is no residue to
      # sweep — but the sweep would still fail, and it fails with "residue
      # survived", which is a false statement about the state of the Appwrite
      # project. One real error beats three, two of which are wrong.
      - name: Sweep end-to-end residue
        if: always() && steps.preflight.outcome == 'success'
        run: npm run e2e:cleanup:commit

      # Fail the job if anything survived the sweep, rather than reporting clean
      # and leaving it for somebody to find in a backfill dry run months later.
      - name: Assert no residue survived
        if: always() && steps.preflight.outcome == 'success'
        run: |
          output="$(npm run e2e:cleanup --silent)"
          echo "$output"
          if ! echo "$output" | grep -qE "test users +0"; then
            echo "::error::End-to-end residue survived the sweep"
            exit 1
          fi

      # No browser trace, storage-state file, or screenshot uploads: they can
      # contain session secrets and provider credentials from Link exchanges.
