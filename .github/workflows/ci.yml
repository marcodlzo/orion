name: CI

# Every check here runs on every change and blocks merge, type and lint
# errors included.
#
# Every job here is required. None may be made non-blocking to get a merge
# through — the audit found ignoreBuildErrors and ignoreDuringBuilds enabled,
# which is exactly how five type errors survived into main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    # PostgreSQL is the future banking system of record. Schema correctness is
    # a property of the server, not of a mock, so these tests need a real one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion_ci_password
          POSTGRES_DB: orion_test
        ports:
          - 5432:5432
        # The job must not start migrating a server that is still booting.
        options: >-
          --health-cmd "pg_isready -U orion -d orion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Placeholders only. No job here may require a real credential — contract
      # tests belong against provider sandboxes with secrets injected
      # explicitly, never against live accounts.
      NEXT_PUBLIC_APPWRITE_ENDPOINT: https://ci.invalid/v1
      NEXT_PUBLIC_APPWRITE_PROJECT: ci-project
      NEXT_APPWRITE_KEY: ci-key
      APPWRITE_DATABASE_ID: ci-db
      APPWRITE_USER_COLLECTION_ID: ci-users
      APPWRITE_BANK_COLLECTION_ID: ci-banks
      APPWRITE_TRANSACTION_COLLECTION_ID: ci-transactions
      PLAID_CLIENT_ID: ci-plaid-client
      PLAID_SECRET: ci-plaid-secret
      DWOLLA_KEY: ci-dwolla-key
      DWOLLA_SECRET: ci-dwolla-secret
      DWOLLA_ENV: sandbox
      # Deliberately NOT set. The webhook tests supply their own secret to the
      # function under test, so nothing here needs one — and leaving it unset
      # means a handler that ever starts reading process.env directly, instead
      # of taking the secret as an argument, fails in CI rather than passing
      # against an accidental value.
      # DWOLLA_WEBHOOK_SECRET
      # TEST_DATABASE_URL only. DATABASE_URL is deliberately NOT set at job
      # scope: the database suites truncate tables and refuse to run when both
      # variables resolve to the same server, which is what stops a developer
      # from wiping their development database. CI must satisfy that same rule
      # rather than be excused from it, so DATABASE_URL is scoped to the one
      # step that needs it — the migration run.
      TEST_DATABASE_URL: postgresql://orion:orion_ci_password@localhost:5432/orion_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Fails the job if PostgreSQL never became ready, rather than letting the
      # database tests skip and report a hollow green.
      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U orion -d orion_test; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready"
          exit 1

      # Proves migrations apply to a completely empty database, every run.
      # DATABASE_URL is scoped to this step alone — see the env note above.
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://orion:orion_ci_password@localhost:5432/orion_test

      - name: Database integration tests
        run: npm run test:db

      - name: Build
        run: npm run build

      # Secrets must never enter browser bundles, and this is verified
      # rather than assumed. Tree-shaking removed the tutorial's
      # Plaid tokens from the emitted .js but left them readable in a served
      # .js.map, so this scans the whole client output including source maps.
      - name: Scan client bundle for credentials
        run: |
          set -euo pipefail
          echo "Scanning .next/static for credential patterns..."
          if grep -rIlE \
            'access-(sandbox|development|production)-[0-9a-f]{8}|processor-(sandbox|development|production)-[0-9a-f]{8}|https://[0-9a-f]{16,}@[a-z0-9.-]*ingest[a-z.-]*sentry\.io|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}' \
            .next/static 2>/dev/null; then
            echo "::error::Credential-shaped string found in client build output"
            exit 1
          fi
          echo "Clean — no credential patterns in client output."

      # Provider credentials must not reach the browser. accessToken and the
      # Dwolla customer identifiers are now absent from client output entirely;
      # this locks that in.
      #
      # fundingSourceUrl is now included: the server owns transfer orchestration
      # and the browser never receives a funding-source URL. Possession of one
      # is sufficient to move money from that account, so this must stay at zero.
      #
      # Only CLIENT output is scanned. Server bundles legitimately contain these
      # names — that is where the work happens.
      - name: Assert provider credentials are absent from client output
        run: |
          set -euo pipefail
          fail=0
          for name in accessToken processorToken fundingSourceUrl dwollaCustomerId dwollaCustomerUrl; do
            if grep -rIlF -- "$name" .next/static 2>/dev/null; then
              echo "::error::'$name' found in client build output"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Clean — no provider credential field reaches the client."

      - name: Assert no source maps are served to clients
        run: |
          set -euo pipefail
          count=$(find .next/static -name '*.js.map' | wc -l)
          echo "client .js.map files: $count"
          if [ "$count" -ne 0 ]; then
            echo "::error::Source maps are being emitted to client static output"
            find .next/static -name '*.js.map'
            exit 1
          fi
