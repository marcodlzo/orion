<svg width="630" height="694" viewBox="0 0 630 694" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An illustration of the Orion dashboard">
<!--
  THE ORION DASHBOARD, drawn.

  What stood here was a 780 KB base64 PNG screenshot of the Horizon tutorial —
  its branding, and a real person's name and email address, served as a public
  asset from the sign-in page. Milestone 11 rebranded the application and missed
  this file, because the text was pixels rather than markup and nothing greps it.

  Vector, so "Orion" is editable text the next time branding changes, and a few
  kilobytes instead of several hundred.

  DELIBERATELY NOT A SCREENSHOT OF REAL DATA. Figures are neutral bars rather
  than invented amounts: this is decoration on a signed-out page, and a banking
  interface should not display a number that means nothing. The words that do
  appear are interface labels, which are true.
-->
  <defs>
    <linearGradient id="orionMark" x1="18" y1="31" x2="18.4" y2="-5.7" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0058D4"/>
      <stop offset="1" stop-color="#00245B"/>
    </linearGradient>
    <linearGradient id="navPill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0179FE"/>
      <stop offset="1" stop-color="#4893FF"/>
    </linearGradient>
  </defs>

  <style>
    .t  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .hd { font-weight: 700; fill: #101828; }
    .nv { font-weight: 600; fill: #475467; font-size: 13px; }
    .mu { font-weight: 500; fill: #98A2B3; font-size: 12px; }
  </style>

  <!-- Device frame -->
  <rect x="3" y="3" width="624" height="688" rx="15" stroke="#101828" stroke-width="6"/>
  <rect x="6" y="6" width="618" height="682" rx="12" fill="white"/>

  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <path d="M6 18a12 12 0 0 1 12-12h178v682H18A12 12 0 0 1 6 676Z" fill="#FCFCFD"/>
  <line x1="196" y1="6" x2="196" y2="688" stroke="#EAECF0" stroke-width="1.5"/>

  <!-- Logo mark, the diamond from the real logo, scaled -->
  <g transform="translate(28,34) scale(0.72)">
    <path d="M33.9823 19.3653L20.0488 33.4978C18.9899 34.5683 17.2778 34.5683 16.2192 33.4978L2.28571 19.3653C1.23028 18.2912 1.23028 16.5547 2.28571 15.4809L16.2192 1.34838C17.2782 0.277877 18.9902 0.277877 20.0488 1.34838L33.9823 15.4809C35.0378 16.5547 35.0378 18.2912 33.9823 19.3653Z" fill="url(#orionMark)"/>
  </g>
  <text class="t hd" x="62" y="56" font-size="22">Orion</text>

  <!-- Search -->
  <rect x="28" y="84" width="150" height="34" rx="8" fill="white" stroke="#EAECF0"/>
  <circle cx="45" cy="101" r="5" stroke="#98A2B3" stroke-width="1.5" fill="none"/>
  <line x1="49" y1="105" x2="52" y2="108" stroke="#98A2B3" stroke-width="1.5" stroke-linecap="round"/>
  <text class="t mu" x="60" y="105">Search</text>

  <!-- Nav: Home is current -->
  <rect x="20" y="140" width="166" height="40" rx="8" fill="url(#navPill)"/>
  <rect x="34" y="153" width="14" height="14" rx="3" stroke="white" stroke-width="1.6" fill="none"/>
  <text class="t nv" x="60" y="165" fill="white">Home</text>

  <circle cx="41" cy="207" r="7" stroke="#667085" stroke-width="1.5" fill="none"/>
  <text class="t nv" x="60" y="212">My Banks</text>

  <rect x="34" y="242" width="14" height="14" rx="2" stroke="#667085" stroke-width="1.5" fill="none"/>
  <text class="t nv" x="60" y="254">Transaction History</text>

  <circle cx="41" cy="291" r="7" stroke="#667085" stroke-width="1.5" fill="none"/>
  <text class="t nv" x="60" y="296">Transfer Funds</text>

  <rect x="34" y="326" width="14" height="12" rx="2" stroke="#667085" stroke-width="1.5" fill="none"/>
  <text class="t nv" x="60" y="338">Connect Bank</text>

  <!-- Signed-in footer: a silhouette, no name and no address -->
  <line x1="20" y1="616" x2="186" y2="616" stroke="#EAECF0" stroke-width="1.5"/>
  <circle cx="40" cy="646" r="13" fill="#E4EEFF"/>
  <circle cx="40" cy="642" r="4.5" fill="#98A2B3"/>
  <path d="M32 653a8 8 0 0 1 16 0Z" fill="#98A2B3"/>
  <rect x="62" y="638" width="70" height="7" rx="3.5" fill="#D0D5DD"/>
  <rect x="62" y="650" width="46" height="6" rx="3" fill="#EAECF0"/>

  <!-- ── Main ────────────────────────────────────────────────── -->
  <text class="t hd" x="228" y="56" font-size="20">Welcome back</text>
  <rect x="228" y="70" width="240" height="7" rx="3.5" fill="#EAECF0"/>

  <!-- Balance card -->
  <rect x="228" y="100" width="368" height="118" rx="12" fill="white" stroke="#EAECF0"/>
  <circle cx="288" cy="159" r="30" stroke="#EAF2FF" stroke-width="12" fill="none"/>
  <circle cx="288" cy="159" r="30" stroke="#0179FE" stroke-width="12" fill="none"
          stroke-linecap="round" stroke-dasharray="132 189" transform="rotate(-90 288 159)"/>
  <text class="t nv" x="342" y="138">2 bank accounts</text>
  <text class="t mu" x="342" y="160">Total current balance</text>
  <rect x="342" y="171" width="122" height="16" rx="5" fill="#D0D5DD"/>

  <!-- Recent transactions -->
  <text class="t hd" x="228" y="264" font-size="16">Recent transactions</text>

  <rect x="228" y="284" width="66" height="7" rx="3.5" fill="#0179FE"/>
  <rect x="228" y="298" width="66" height="2.5" rx="1.25" fill="#0179FE"/>
  <rect x="312" y="284" width="74" height="7" rx="3.5" fill="#EAECF0"/>
  <rect x="404" y="284" width="82" height="7" rx="3.5" fill="#EAECF0"/>
  <line x1="228" y1="312" x2="596" y2="312" stroke="#EAECF0" stroke-width="1.5"/>

  <!-- Rows: avatar, label, amount, status. No names, no figures. -->
  <g>
    <rect x="228" y="324" width="368" height="44" rx="8" fill="#FCFCFD"/>
    <circle cx="250" cy="346" r="11" fill="#E4EEFF"/>
    <rect x="272" y="342" width="104" height="8" rx="4" fill="#D0D5DD"/>
    <rect x="410" y="342" width="52" height="8" rx="4" fill="#D0D5DD"/>
    <rect x="492" y="338" width="62" height="17" rx="8.5" fill="#ECFDF3"/>
  </g>
  <g>
    <circle cx="250" cy="392" r="11" fill="#F2F4F7"/>
    <rect x="272" y="388" width="126" height="8" rx="4" fill="#EAECF0"/>
    <rect x="410" y="388" width="44" height="8" rx="4" fill="#EAECF0"/>
    <rect x="492" y="384" width="62" height="17" rx="8.5" fill="#FFFAEB"/>
  </g>
  <g>
    <rect x="228" y="414" width="368" height="44" rx="8" fill="#FCFCFD"/>
    <circle cx="250" cy="436" r="11" fill="#E4EEFF"/>
    <rect x="272" y="432" width="92" height="8" rx="4" fill="#D0D5DD"/>
    <rect x="410" y="432" width="58" height="8" rx="4" fill="#D0D5DD"/>
    <rect x="492" y="428" width="62" height="17" rx="8.5" fill="#ECFDF3"/>
  </g>
  <g>
    <circle cx="250" cy="482" r="11" fill="#F2F4F7"/>
    <rect x="272" y="478" width="138" height="8" rx="4" fill="#EAECF0"/>
    <rect x="410" y="478" width="48" height="8" rx="4" fill="#EAECF0"/>
    <rect x="492" y="474" width="62" height="17" rx="8.5" fill="#ECFDF3"/>
  </g>
  <g>
    <rect x="228" y="504" width="368" height="44" rx="8" fill="#FCFCFD"/>
    <circle cx="250" cy="526" r="11" fill="#E4EEFF"/>
    <rect x="272" y="522" width="110" height="8" rx="4" fill="#D0D5DD"/>
    <rect x="410" y="522" width="40" height="8" rx="4" fill="#D0D5DD"/>
    <rect x="492" y="518" width="62" height="17" rx="8.5" fill="#FEF3F2"/>
  </g>
  <g>
    <circle cx="250" cy="572" r="11" fill="#F2F4F7"/>
    <rect x="272" y="568" width="120" height="8" rx="4" fill="#EAECF0"/>
    <rect x="410" y="568" width="54" height="8" rx="4" fill="#EAECF0"/>
    <rect x="492" y="564" width="62" height="17" rx="8.5" fill="#ECFDF3"/>
  </g>

  <line x1="228" y1="614" x2="596" y2="614" stroke="#EAECF0" stroke-width="1.5"/>
  <rect x="228" y="634" width="96" height="7" rx="3.5" fill="#EAECF0"/>
  <rect x="524" y="630" width="30" height="16" rx="6" fill="#F2F4F7"/>
  <rect x="562" y="630" width="30" height="16" rx="6" fill="#F2F4F7"/>
</svg>
